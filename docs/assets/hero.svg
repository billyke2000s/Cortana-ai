<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Cortana AI: a local holographic assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#051634"/><stop offset=".6" stop-color="#020a1c"/><stop offset="1" stop-color="#01050f"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8f6ff" stop-opacity=".95"/><stop offset=".25" stop-color="#5cc8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff0ff" stop-opacity=".8"/><stop offset=".4" stop-color="#3fa9ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a3a8a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7fd4ff" stop-opacity=".55"/><stop offset="1" stop-color="#7fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bff0ff" stop-opacity="0"/><stop offset=".5" stop-color="#bff0ff" stop-opacity=".9"/>
      <stop offset="1" stop-color="#bff0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5cc8ff" stroke-opacity=".06"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="460" rx="18"/></clipPath>
    <style>
      .spin{transform-origin:640px 210px;animation:spin 24s linear infinite}
      .spin.r2{animation-duration:38s;animation-direction:reverse}
      .spin.r3{animation-duration:16s}
      @keyframes spin{to{transform:rotate(360deg)}}
      .pulse{animation:pulse 3.2s ease-in-out infinite;transform-origin:640px 210px}
      @keyframes pulse{50%{opacity:.55;transform:scale(.92)}}
      .ripple{transform-origin:640px 330px;animation:ripple 4s ease-out infinite}
      .ripple.b{animation-delay:2s}
      @keyframes ripple{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.25);opacity:0}}
      .beam{animation:beam 2.6s ease-in-out infinite}
      @keyframes beam{50%{opacity:.35}}
      .scanline{animation:scan 5s linear infinite}
      @keyframes scan{0%{transform:translateY(-20px)}100%{transform:translateY(480px)}}
      .title{font:800 74px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:18px;fill:#9fe2ff}
      .flicker{animation:flicker 7s infinite}
      @keyframes flicker{0%,93%,100%{opacity:1}94%{opacity:.4}95%{opacity:1}96.5%{opacity:.6}97%{opacity:1}}
      .sub{font:600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:6px;fill:#a9c6e6}
      .line{font:600 19px 'Cascadia Code',Consolas,'Courier New',monospace;fill:#d8f5ff}
      .t1,.t2,.t3,.t4{opacity:0;animation:cycle 16s infinite}
      .t2{animation-delay:4s}.t3{animation-delay:8s}.t4{animation-delay:12s}
      @keyframes cycle{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:none}22%{opacity:1}25%,100%{opacity:0}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .wave rect{transform-origin:center;transform-box:fill-box;animation:wave 1.1s ease-in-out infinite}
      @keyframes wave{50%{transform:scaleY(.35)}}
      .dot{animation:float 6s linear infinite}
      @keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.9}100%{transform:translateY(-70px);opacity:0}}
      .online{animation:pulse2 2.4s ease-in-out infinite}
      @keyframes pulse2{50%{opacity:.35}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.t1{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="460" fill="url(#bg)"/>
    <rect width="1280" height="460" fill="url(#grid)"/>
    <!-- circuit traces -->
    <g fill="none" stroke="#3d9ee6" stroke-opacity=".45" stroke-width="1.2">
      <path d="M0 420 L60 360 L60 330 L250 330"/><path d="M0 446 L80 376 L330 376"/>
      <path d="M1280 70 L1150 70 L1110 110 L940 110"/><path d="M1280 400 L1200 330 L1200 220"/>
      <path d="M40 0 L40 60 L110 60"/><path d="M1240 460 L1240 420 L1120 420"/>
    </g>
    <g fill="#5cc8ff"><circle cx="250" cy="330" r="3"/><circle cx="330" cy="376" r="3"/><circle cx="940" cy="110" r="3"/><circle cx="1200" cy="220" r="3"/></g>
    <!-- hologram core -->
    <g transform="translate(80 0)">
    <g filter="url(#glow)">
      <g class="spin"><circle cx="640" cy="210" r="150" fill="none" stroke="#5cc8ff" stroke-opacity=".3"/>
        <circle cx="640" cy="210" r="150" fill="none" stroke="#5cc8ff" stroke-width="5" stroke-dasharray="70 180 30 200 110 352"/></g>
      <g class="spin r2"><circle cx="640" cy="210" r="132" fill="none" stroke="#7fd4ff" stroke-opacity=".3" stroke-dasharray="2 7"/>
        <circle cx="640" cy="210" r="132" fill="none" stroke="#9fe2ff" stroke-width="2.5" stroke-dasharray="14 8 14 8 14 230 40 500"/></g>
      <g class="spin r3"><circle cx="640" cy="210" r="112" fill="none" stroke="#bff0ff" stroke-width="1.2" stroke-dasharray="1 14"/></g>
    </g>
    <circle class="pulse" cx="640" cy="210" r="80" fill="url(#core)" filter="url(#bigglow)"/>
    <!-- light column and platform -->
    <rect class="beam" x="590" y="190" width="100" height="140" fill="url(#beam)" opacity=".6"/>
    <g class="beam" stroke="#bff0ff" stroke-opacity=".5"><line x1="605" y1="230" x2="605" y2="328"/><line x1="625" y1="205" x2="625" y2="330"/>
      <line x1="655" y1="220" x2="655" y2="330"/><line x1="675" y1="240" x2="675" y2="328"/></g>
    <ellipse cx="640" cy="330" rx="240" ry="34" fill="url(#pool)" opacity=".6"/>
    <g fill="none" filter="url(#glow)">
      <ellipse cx="640" cy="330" rx="210" ry="28" stroke="#5cc8ff" stroke-width="2.4" stroke-dasharray="110 20 50 14 180 24"/>
      <ellipse cx="640" cy="330" rx="165" ry="21" stroke="#9fe2ff" stroke-width="1.6"/>
      <ellipse cx="640" cy="330" rx="120" ry="15" stroke="#cdf3ff" stroke-dasharray="3 6"/>
      <ellipse class="ripple" cx="640" cy="330" rx="180" ry="24" stroke="#7fd4ff"/>
      <ellipse class="ripple b" cx="640" cy="330" rx="180" ry="24" stroke="#7fd4ff"/>
    </g>
    <ellipse cx="640" cy="332" rx="52" ry="4" fill="#eaffff" filter="url(#glow)"/>
    <!-- particles -->
    <g fill="#bff0ff">
      <circle class="dot" cx="560" cy="300" r="1.6"/><circle class="dot" cx="700" cy="290" r="1.4" style="animation-delay:-2s"/>
      <circle class="dot" cx="610" cy="270" r="1.2" style="animation-delay:-4s"/><circle class="dot" cx="730" cy="250" r="1.6" style="animation-delay:-1s"/>
      <circle class="dot" cx="540" cy="240" r="1.2" style="animation-delay:-3s"/><circle class="dot" cx="672" cy="300" r="1.3" style="animation-delay:-5s"/>
    </g>
    </g>
    <!-- left: title -->
    <text x="70" y="96" class="sub">LOCAL AI // HOLOGRAPHIC INTERFACE</text>
    <text x="64" y="176" class="title flicker" filter="url(#glow)">CORTANA</text>
    <rect x="70" y="200" width="300" height="2" fill="#5cc8ff" opacity=".6"/>
    <g class="line">
      <text class="t1" x="70" y="250">&gt; streaming voice replies</text>
      <text class="t2" x="70" y="250">&gt; runs 100% on your PC</text>
      <text class="t3" x="70" y="250">&gt; timers · memory · weather</text>
      <text class="t4" x="70" y="250">&gt; your phone is the display</text>
    </g>
    <rect class="cursor" x="70" y="262" width="12" height="3" fill="#9fe2ff"/>
    <!-- right: status panel -->
    <g transform="translate(930 150)">
      <path d="M14 0H290V96L276 110H0V14Z" fill="#082044" fill-opacity=".75" stroke="#5cc8ff" stroke-opacity=".7"/>
      <circle class="online" cx="26" cy="28" r="5" fill="#3df58a"/>
      <text x="40" y="33" style="font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#e8f4ff">SYSTEM ONLINE</text>
      <g class="wave" fill="#5cc8ff">
        <rect x="24" y="62" width="4" height="30" rx="2"/><rect x="34" y="56" width="4" height="42" rx="2" style="animation-delay:-.2s"/>
        <rect x="44" y="66" width="4" height="22" rx="2" style="animation-delay:-.4s"/><rect x="54" y="52" width="4" height="50" rx="2" style="animation-delay:-.1s"/>
        <rect x="64" y="60" width="4" height="34" rx="2" style="animation-delay:-.5s"/><rect x="74" y="68" width="4" height="18" rx="2" style="animation-delay:-.3s"/>
        <rect x="84" y="58" width="4" height="38" rx="2" style="animation-delay:-.6s"/><rect x="94" y="64" width="4" height="26" rx="2" style="animation-delay:-.15s"/>
      </g>
      <text x="116" y="72" style="font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#a9c6e6">QWEN 3.5 · PIPER</text>
      <text x="116" y="92" style="font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:2px;fill:#a9c6e6">WHISPER · THREE.JS</text>
    </g>
    <!-- scan line -->
    <rect class="scanline" x="0" y="0" width="1280" height="2" fill="url(#scan)" opacity=".7"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="459" rx="18" fill="none" stroke="#5cc8ff" stroke-opacity=".35"/>
</svg>
