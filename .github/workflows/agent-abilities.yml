name: Agent abilities checks
on:
  push:
    branches: ['feature/agent-abilities']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
      - run: python tests/agent_browser_check.py
      - run: docker pull python:3.12-slim
      - run: python tests/agent_sandbox_check.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python tests/agent_windows_check.py
      - run: python build/build_cortana.py
      - run: python tests/agent_exe_check.py dist/Cortana.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cortana-agent-windows
          path: dist/Cortana.exe
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen3.5:4b','qwen3.5:9b']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
          ollama pull '${{ matrix.model }}'
      - run: python tests/ci_context_check.py '${{ matrix.model }}'
      - run: python tests/ci_agent_model_check.py '${{ matrix.model }}'
