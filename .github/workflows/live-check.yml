name: Live check (search + wake word)

# Manual: real web searches without a key, and "Hey Cortana" through Windows TTS + the real whisper.cpp.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Model check: only asks containing this text (empty = all)'
        required: false
        default: ''
      repeat:
        description: 'Model check: runs per ask'
        required: false
        default: '2'

jobs:
  live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get whisper.cpp (same version as the app)
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ggml-org/whisper.cpp/releases/download/v1.8.2/whisper-bin-x64.zip -OutFile w.zip
          Expand-Archive w.zip -DestinationPath whisper
          Invoke-WebRequest https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin -OutFile ggml-base.en.bin
          $cli = (Get-ChildItem whisper -Recurse -Filter whisper-cli.exe | Select-Object -First 1).FullName
          "WHISPER=$cli" | Out-File -Append $env:GITHUB_ENV
      - name: Live check
        run: python tests/ci_live_check.py "${{ env.WHISPER }}" ggml-base.en.bin

  model:
    # Real Qwen 3.5 on a CPU runner: tool choice with the real prompt + schemas, and reading an image (AGENTS.md §6.6).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ollama and the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (OLLAMA_CONTEXT_LENGTH=6144 ollama serve > ollama.log 2>&1 &)
          sleep 5
          ollama pull qwen3.5:4b
          ollama --version
      - name: Model check
        env:
          ONLY: ${{ github.event.inputs.only }}
          REPEAT: ${{ github.event.inputs.repeat || '2' }}
        run: |
          pip install -r requirements.txt pillow
          sudo apt-get install -y fonts-dejavu-core > /dev/null
          python tests/ci_model_check.py qwen3.5:4b
