name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.6.0)'
        required: true
concurrency:
  group: cortana-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_check.py
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: ['qwen3.5:4b', 'qwen3.5:9b']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Start local Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (OLLAMA_CONTEXT_LENGTH=6144 ollama serve > /tmp/ollama.log 2>&1 &)
          sleep 5
      - name: Check real 4B and 9B models with retrieved memory and recap
        run: |
          ollama pull '${{ matrix.model }}'
          python tests/ci_context_check.py '${{ matrix.model }}'
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: pip install -r requirements-build.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Native keyword detector and notification process
        run: python tests/ci_native_check.py
      - name: Build Cortana.exe
        run: python build/build_cortana.py
      - name: Smoke test the built exe including the reference voice
        shell: pwsh
        run: |
          $env:CORTANA_DATA_DIR = "$env:RUNNER_TEMP\cortana-smoke"
          $p = Start-Process dist\Cortana.exe -ArgumentList '--headless','--no-open','--no-tunnel','--port','8777' -PassThru
          try {
            python tests/exe_smoke.py http://127.0.0.1:8777
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/release_voice_check.py http://127.0.0.1:8777
            $code = $LASTEXITCODE
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: cortana-windows
          path: dist/Cortana.exe
          retention-days: 7
  publish:
    needs: [ui, models, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cortana-windows
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Cortana ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/Cortana.exe
          body: |
            Download Cortana.exe and run it on Windows 10/11. Keep the launcher open.

            What changed: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/CHANGELOG.md).

            Windows SmartScreen may warn because the app isn't code-signed: click **More info → Run anyway**.
